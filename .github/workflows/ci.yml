name: CI — Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  docker-build:
    name: Docker Compose Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env from .env.example for CI
        run: |
          cp .env.example .env
          sed -i 's/<REPLACE_THIS_WITH_A_LONG_RANDOM_STRING>/ci-secret-key-not-for-production/g' .env
          sed -i 's/<REPLACE_THIS_WITH_A_STRONG_PASSWORD>/ci_password/g' .env
          sed -i 's/<REPLACE_THIS_WITH_YOUR_AWS_ACCESS_KEY>/ci_aws_key/g' .env
          sed -i 's/<REPLACE_THIS_WITH_YOUR_AWS_SECRET_KEY>/ci_aws_secret/g' .env
          sed -i 's/<REPLACE_THIS_WITH_YOUR_EMAIL>/ci@example.com/g' .env
          sed -i 's/<REPLACE_THIS_WITH_YOUR_APP_PASSWORD>/ci_email_password/g' .env
          sed -i 's|postgresql://interviewiq_user:<REPLACE_THIS_WITH_A_STRONG_PASSWORD>@postgres|postgresql://interviewiq_user:ci_password@postgres|g' .env

      - name: Build all Docker images
        run: docker compose build --no-cache --parallel

      - name: Validate docker-compose config
        run: docker compose config --quiet
